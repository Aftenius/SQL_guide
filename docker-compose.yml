services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sql_guide
      POSTGRES_PASSWORD: sql_guide
      POSTGRES_DB: sql_guide
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sql_guide -d sql_guide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sql_guide_pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  sql_guide_pg:
