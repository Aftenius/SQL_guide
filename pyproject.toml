[project]
name = "sql-guide"
version = "0.1.0"
description = "SQL and database learning platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_guide"]

[project.scripts]
sql-guide = "sql_guide.presentation.app:main"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
exclude = ["^\\.venv/", "^build/", "^dist/", "^alembic/"]
